server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Allow CORS for trusted origins (browser preflight + actual)
    set $cors_allow_origin "";
    # Dynamically allow exact-match origins from env (generated include)
    # This file will contain multiple lines like:
    #   if ($http_origin = "http://localhost:3000") { set $cors_allow_origin $http_origin; }
    include /etc/nginx/http.d/cors-allow.inc;
    # Add CORS headers only when enabled (generated include)
    include /etc/nginx/http.d/cors-headers.inc;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' http: https:;" always;
    # (moved to cors-headers.inc)

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json;

    # Handle Laravel routing
    location / {
        # Handle preflight at Nginx level only when enabled (generated include)
        include /etc/nginx/http.d/cors-options.inc;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Forward CORS-related headers so Laravel can see Origin and preflight intent
        fastcgi_param HTTP_ORIGIN $http_origin;
        fastcgi_param HTTP_ACCESS_CONTROL_REQUEST_METHOD $http_access_control_request_method;
        fastcgi_param HTTP_ACCESS_CONTROL_REQUEST_HEADERS $http_access_control_request_headers;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 4 32k;
        fastcgi_busy_buffers_size 64k;
        # Pass CORS and security headers from PHP-FPM
        fastcgi_pass_header Access-Control-Allow-Origin;
        fastcgi_pass_header Access-Control-Allow-Headers;
        fastcgi_pass_header Access-Control-Allow-Methods;
        fastcgi_pass_header Access-Control-Allow-Credentials;
        fastcgi_pass_header Access-Control-Expose-Headers;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to sensitive files
    location ~ /(?:web\.config|\.htaccess|composer\.json|composer\.lock|package\.json|package-lock\.json|yarn\.lock)$ {
        deny all;
    }

    # Handle static assets
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Log files
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
