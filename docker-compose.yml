version: '3.8'

services:
  stiqrcanvas-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stiqrcanvas-be-prod
    ports:
      - "80:80"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_NAME=canvas
      - APP_ENV=production
      - APP_KEY=base64:8X3b/3Tz0b2JkqN06wi0Z2u3M3oXq6N8Zy0x5yJ8xR4=
      - APP_DEBUG=false
      - APP_URL=http://localhost
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=error
      - DB_CONNECTION=pgsql
      - DB_HOST=stiqrcanvas-postgres
      - DB_PORT=5432
      - DB_DATABASE=canvas
      - DB_USERNAME=canvas
      - DB_PASSWORD=canvas_password
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
      # Filesystem Configuration
      - FILESYSTEM_DISK=s3
      # AWS S3 Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-1}
      - AWS_BUCKET=${AWS_BUCKET}
      - AWS_URL=${AWS_URL}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - AWS_USE_PATH_STYLE_ENDPOINT=${AWS_USE_PATH_STYLE_ENDPOINT:-false}
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - stiqrcanvas-network
    depends_on:
      stiqrcanvas-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  stiqrcanvas-postgres:
    image: postgres:16-alpine
    container_name: stiqrcanvas-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=canvas
      - POSTGRES_USER=canvas
      - POSTGRES_PASSWORD=canvas_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - stiqrcanvas_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - stiqrcanvas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  stiqrcanvas-network:
    driver: bridge

volumes:
  stiqrcanvas_postgres_data:
    driver: local
